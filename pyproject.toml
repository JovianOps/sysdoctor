[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysdoctor"
version = "1.0.0"
description = "Cross-platform system diagnostics and safe cleanup"
requires-python = ">=3.9"

[project.scripts]
sysdoctor = "sysdoctor.sysdoctor:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages]
find = {include = ["sysdoctor"]}
